name = "nn-vow"
compatibility_date = "2026-09-13"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "nn-vow"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nn-vow-media"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
